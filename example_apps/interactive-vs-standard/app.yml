version: 2
name: CONCURRENCY_DEMO
database: SNOWFLAKE_APPS
schema: PUBLIC
query_warehouse: SNOWFLAKE_APPS_QUERY_WH
label: The Concurrency Test
description: Live XSMALL standard and interactive warehouse comparison
icon: public/icon.svg
min_instances: 1
max_instances: 1
auto_suspend_secs: 900
ignore:
  - node_modules
  - .env*
  - __pycache__
  - "*.pyc"
  - .next
  - .git
  - snowflake.log
  - app.yml.builder
  - sql
  - test-results
  - output
  - "*.tsbuildinfo"
  - AGENTS.md
  - __tests__
install:
  commands:
    - ["npm", "ci", "--include=dev"]
build:
  commands:
    - ["npm", "run", "build"]
    - ["cp", "-r", ".next/static", ".next/standalone/.next/static"]
    - ["cp", "-r", "public", ".next/standalone/public"]
    - ["rm", "-rf", "node_modules"]
run:
  command: ["node", ".next/standalone/server.js"]
environment_variables:
  - name: SNOWFLAKE_SDK_QUIET
    value: "1"
