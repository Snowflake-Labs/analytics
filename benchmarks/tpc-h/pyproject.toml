[project]
name = "iw-tpch"
version = "0.4.0"
description = "TPC-H benchmark runner for Snowflake warehouses"
requires-python = ">=3.13"
dependencies = [
    "bench-core",
]

[project.scripts]
iw-tpch = "tpch.cli:main"

[tool.uv.sources]
bench-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tpch"]
