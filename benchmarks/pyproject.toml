# uv workspace: one shared virtualenv + lockfile for all benchmarks.
[project]
name = "benchmarks"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = ["core", "tpc-h", "ssb"]

# Resolve from public PyPI regardless of machine-level uv config (e.g. an
# internal mirror in /etc/uv/uv.toml), so uv.lock works for everyone.
[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[dependency-groups]
dev = [
    "ruff>=0.11.0",
]
