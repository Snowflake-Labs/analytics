# uv workspace: one shared virtualenv + lockfile for all benchmarks.
[project]
name = "benchmarks"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = ["core", "tpc-h", "ssb"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[dependency-groups]
dev = [
    "ruff>=0.11.0",
]
