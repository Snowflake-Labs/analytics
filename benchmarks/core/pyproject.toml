[project]
name = "bench-core"
version = "0.1.0"
description = "Shared Snowflake benchmark harness (setup / run / teardown / results) used by tpc-h and ssb"
requires-python = ">=3.13"
dependencies = [
    "keyring>=25.7.0",
    "python-dotenv>=1.2.2",
    "snowflake-connector-python>=4.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bench_core"]
