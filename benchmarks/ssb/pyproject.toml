[project]
name = "iw-ssb"
version = "0.2.0"
description = "SSB (Star Schema Benchmark) runner for Snowflake warehouses"
requires-python = ">=3.13"
dependencies = [
    "bench-core",
]

[project.scripts]
iw-ssb = "ssb.cli:main"

[tool.uv.sources]
bench-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ssb"]
