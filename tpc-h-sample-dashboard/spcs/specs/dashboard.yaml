spec:
  containers:
    - name: dashboard
      image: /${DB}/${SCHEMA}/${IMAGE_REPO}/${DASHBOARD_IMAGE}:${IMAGE_TAG}
      env:
        PORT: "${DASHBOARD_PORT}"
        DEFAULT_SCALE: "${DASHBOARD_DEFAULT_SCALE}"
        SOLUTION_NAME: "${SOLUTION_NAME}"
        DASHBOARD_DATABASE: "${DASHBOARD_DATABASE}"
        DASHBOARD_ROLE: "${DASHBOARD_ROLE}"
        DASHBOARD_WAREHOUSE: "${DASHBOARD_WAREHOUSE}"
        SNOWFLAKE_DATABASE: "${DASHBOARD_DATABASE}"
        SNOWFLAKE_ROLE: "${DASHBOARD_ROLE}"
        SNOWFLAKE_WAREHOUSE: "${DASHBOARD_WAREHOUSE}"
        WORKERS: "${DASHBOARD_WORKERS}"
        POOL_SIZE: "${DASHBOARD_POOL_SIZE}"
        POOL_WARMUP: "${DASHBOARD_POOL_WARMUP}"
        POOL_ACQUIRE_TIMEOUT: "${DASHBOARD_POOL_ACQUIRE_TIMEOUT}"
        LOCUST_URL: "${DASHBOARD_LOCUST_URL}"
      resources:
        requests:
          memory: "${DASHBOARD_MEMORY_REQUEST}"
          cpu: "${DASHBOARD_CPU_REQUEST}"
        limits:
          memory: "${DASHBOARD_MEMORY_LIMIT}"
          cpu: "${DASHBOARD_CPU_LIMIT}"
      readinessProbe:
        port: ${DASHBOARD_PORT}
        path: /api/config
  endpoints:
    - name: web
      port: ${DASHBOARD_PORT}
      public: true
      protocol: HTTP
